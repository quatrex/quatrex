simulation_dir = "."
input_dir = "../w90/carbon-nanotube/inputs"

formalism = "wf" # "negf" or "wf"

[device]
transport_direction = "a"
kpoint_grid = [1, 1, 1]
num_orbitals_per_atom = { "C" = 3 }
particle_type = "boson"

    [[device.contacts]]
    name = "left"
    origin = [0.1551, 0.0, 0.0]
    lattice_vectors = [[4.27615261, 0, 0], [0, 50, 0], [0, 0, 50]]
    transport_direction = "a"
    temperature = 301
    mid_gap_energy = 0.0

    [[device.contacts]]
    name = "right"
    origin = [102.694, 0.0, 0.0]
    lattice_vectors = [[-4.27615261, 0, 0], [0, 50, 0], [0, 0, 50]]
    transport_direction = "a"
    temperature = 300
    mid_gap_energy = 0.0

[qtbm] # ===============================================================
max_batch_size = 2000


[outputs] # Select which outputs to write.
electron_ldos = true
device_currents = true
electron_density = true
hole_density = true


[electron] # ===========================================================
# Energy grid.
energy_window_min = 4e-5
energy_window_max = 0.2018
energy_window_num = 1010

solver.direct_solver = "cudss"

obc.algorithm = "spectral"
obc.nevp_solver = "beyn"

# Parameters for Beyn's method.
obc.num_ref_iterations = 3
obc.max_decay = 15
obc.min_decay = 1e-8
obc.r_o = 1.1
obc.r_i = 0.9
obc.m_0 = 93
obc.num_quad_points = 64

obc.residual_tolerance = 1e-4
