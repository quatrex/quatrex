simulation_dir = "."
input_dir = "../inputs"

formalism = "negf"


[device]
transport_direction = "a"
num_orbitals_per_atom = { "C" = 13 }
kpoint_grid = [1, 1, 1]
kpoint_shift = [0, 0, 0]

block_size = 260

    [[device.contacts]]
    name = "left"
    origin = [0.65, 0, 0]
    lattice_vectors = [[25.7031, 0, 0], [0, 10, 0], [0, 0, 10]]
    transport_direction = "a"
    fermi_level = -3
    mid_gap_energy = -4.5

    [[device.contacts]]
    name = "right"
    origin = [256.4, -0.001, -0.001]
    lattice_vectors = [[-25.7031, 0, 0], [0, 10, 0], [0, 0, 10]]
    transport_direction = "a"
    fermi_level = -3.001
    mid_gap_energy = -4.5

[scba] # =============================================================
max_iterations = 2
mixing_factor = 0.75
phonon = true

[outputs] # Select which outputs to write.
electron_ldos = true
device_currents = true
electron_density = true
hole_density = true
self_energy_density = true


[electron]

energy_window_min = -5
energy_window_max = -4
energy_window_num = 10

obc.algorithm = "spectral"
obc.num_ref_iterations = 10
obc.nevp_solver = "full"
obc.r_o = 1000
obc.r_i = 0.9
obc.m_0 = 100
obc.num_quad_points = 64
obc.min_decay = 1e-8
obc.max_decay = 10


[phonon]
interaction_cutoff = 5.0 # Angstrom

model = "pseudo-scattering"
phonon_energy = 40e-3         # eV
deformation_potential = 15e-3 # eV


[compute]
numba_num_threads = 1
blas_num_threads = 4
