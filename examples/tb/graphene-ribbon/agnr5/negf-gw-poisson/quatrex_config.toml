simulation_dir = "."
input_dir = "../inputs"

formalism = "negf"

[scba]
# NOTE: The number of SCBA iterations is set by the interleaved
# Schrödinger-Poisson loop, see `scba_iterations_per_step`.
mixing_factor = 0.5
convergence_tol = 0.05 # eV

coulomb_screening = true
phonon = true

symmetric = true

[scsp]
mixer = "under-relaxation"
mixing_factor = 0.3
adaptive_mixing = false

# The SCBA and the Schrödinger-Poisson loop are interleaved, i.e., the
# self-energies are kept from one potential to the next.
scba_iterations_per_step = 2

max_iterations = 80
convergence_tol = 2e-3 # V

[electrostatics]
# The ribbon is embedded in SiO2, consistent with `epsilon_r` in
# [coulomb_screening].
default_epsilon_r = 3.9
density_model = "ldos"

[device]
transport_direction = "a"
# Two unit cells (8.52 Å), so that the blocks cover the interaction cutoff.
block_size = 20
kpoint_grid = [1, 1, 1]
num_orbitals_per_atom = { "C" = 1 }

    [device.geometry]
    default_mesh_size = 2
    atoms_mesh_size = 0.7

        # Double gate over the channel (x = 55 to 115 Å), 6 Å from the ribbon.
        [[device.geometry.regions]]
        name = "gate_bottom"

        shape.type = "rectangle"
        shape.center = [85.0, 10.0, 4.0]
        shape.normal = [0, 0, 1]
        shape.tangent = [1, 0, 0]
        shape.length = 60.0
        shape.width = 20.0

        properties.voltage = 0.0

        [[device.geometry.regions]]
        name = "gate_top"

        shape.type = "rectangle"
        shape.center = [85.0, 10.0, 16.0]
        shape.normal = [0, 0, 1]
        shape.tangent = [1, 0, 0]
        shape.length = 60.0
        shape.width = 20.0

        properties.voltage = 0.0

        # n-doped leads, 0.0852 e per unit cell.
        [[device.geometry.regions]]
        name = "left"

        shape.type = "box"
        shape.bounds = [[-1.0, 0, 0], [55.0, 20, 20]]

        properties.donor_concentration = 5e19 # cm^-3

        [[device.geometry.regions]]
        name = "right"

        shape.type = "box"
        shape.bounds = [[115.0, 0, 0], [171.0, 20, 20]]

        properties.donor_concentration = 5e19 # cm^-3


    # NOTE: GW renormalizes the bands, but band edge tracking is not
    # available in Schrödinger-Poisson runs. All levels are therefore set
    # to those of the homogeneous, doped ribbon with GW, see the README.
    [[device.contacts]]
    name = "left"
    origin = [-0.001, 0.0, 0.0]
    lattice_vectors = [[8.52, 0, 0], [0, 20, 0], [0, 0, 20]]
    transport_direction = "a"

    fermi_level = -1.118
    mid_gap_energy = -1.43
    conduction_band_edge = -1.23

    voltage = 0.0

    [[device.contacts]]
    name = "right"
    origin = [170.399, 0.0, 0.0]
    lattice_vectors = [[-8.52, 0, 0], [0, 20, 0], [0, 0, 20]]
    transport_direction = "a"

    fermi_level = -1.118
    mid_gap_energy = -1.43
    conduction_band_edge = -1.23

    voltage = 0.1

[outputs]
# NOTE: Required to compute the charge density.
electron_density = true
hole_density = true
meir_wingreen_currents = true
device_currents = true

[electron]
energy_window_min = -16.4
energy_window_max = 13.6
energy_window_num = 6001

max_batch_size = 15
solver.algorithm = "rgf"

obc.algorithm = "spectral"
obc.nevp_solver = "full"
obc.max_decay = 15
obc.residual_tolerance = 1e-4
obc.memoizer.mode = "off"

[coulomb_screening]
# NOTE: Slightly more than one unit cell (4.26 Å). The SCBA does not
# converge with 8 Å, see the README.
interaction_cutoff = 4.5 # Å
epsilon_r = 4.0

# V P V is block tridiagonal (3 x 4.5 Å < 2 x 8.52 Å).
num_connected_blocks = 2

max_batch_size = 15
solver.algorithm = "rgf"

obc.algorithm = "spectral"
obc.nevp_solver = "full"
obc.max_decay = 15
obc.residual_tolerance = 1e-4
obc.memoizer.mode = "off"

lyapunov.algorithm = "spectral"
lyapunov.num_ref_iterations = 1
lyapunov.memoizer.mode = "off"

[phonon]
interaction_cutoff = 4.5 # Å
model = "pseudo-scattering"
phonon_energy = 50e-3
deformation_potential = 25e-3
