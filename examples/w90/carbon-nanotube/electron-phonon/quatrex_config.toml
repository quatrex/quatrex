simulation_dir = "."
input_dir = "../inputs"

formalism = "negf" # "negf" or "wf"

[device]
transport_direction = "a"
block_size = 64

    [[device.contacts]]
    name = "left"
    origin = [1.281, 0.0, 0.0]
    lattice_vectors = [[4.26, 0, 0], [0, 30, 0], [0, 0, 30]]
    transport_direction = "a"
    mid_gap_energy = -3.701998808382495 # Set by `quatrex pre-process`
    fermi_level = -3.692714333268746 # Set by `quatrex pre-process`
    conduction_band_edge = -3.4028137150164186 # Set by `quatrex pre-process`

    [[device.contacts]]
    name = "right"
    origin = [102.075, 0.0, 0.0]
    lattice_vectors = [[-4.26, 0, 0], [0, 30, 0], [0, 0, 30]]
    transport_direction = "a"
    mid_gap_energy = -3.7019988083824913 # Set by `quatrex pre-process`
    fermi_level = -3.69271433326992 # Set by `quatrex pre-process`
    conduction_band_edge = -3.4028137150164195 # Set by `quatrex pre-process`

[scba] # ===============================================================
max_iterations = 2
mixing_factor = 1

phonon = true

symmetric = true

[outputs] # Select which outputs to write.
electron_ldos = true
device_currents = true
meir_wingreen_currents = true
electron_density = true
hole_density = true

self_energy_density = true

# If enabled, the profiling stats will take a bit of time to crunch the
# numbers.
save_profiling_results = true


[electron] # ===========================================================
# Energy grid.
energy_window_min = -5.6
energy_window_max = -1.6
energy_window_num = 50

solver.algorithm = "rgf"
solver.max_batch_size = 1000

obc.algorithm = "spectral"
obc.nevp_solver = "full"

obc.max_decay = 15
obc.min_decay = 1e-3

obc.memoizer.mode = "off"

[phonon]
interaction_cutoff = 5.5  # Å
model = "deformation-potential"
temperature = 300  # K
# Deformation potentials are of order 1 eV / 1 eV/Å:
# https://journals.aps.org/prb/abstract/10.1103/PhysRevB.104.195201#s3
acoustic_deformation_potential = 1  # eV
optical_deformation_potential = 1  # eV / Å
atom_mass_u = 12  # In the unified atomic mass unit
lattice_constant = 4.26  # Å

[pre_process]
compute_fermi_level = true
