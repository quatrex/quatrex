simulation_dir = "."
input_dir = "../inputs"

formalism = "negf"

[scba]
# NOTE: The number of SCBA iterations is set by the interleaved
# Schrödinger-Poisson loop, see `scba_iterations_per_step`.
mixing_factor = 0.5
# NOTE: The maximum self-energy update levels off at about 0.05 - 0.35 eV,
# due to valence states below -4.9 eV, see the README.
convergence_tol = 0.5 # eV

coulomb_screening = true
phonon = true

symmetric = true

[scsp]
mixer = "under-relaxation"
mixing_factor = 0.3
adaptive_mixing = false

# The SCBA and the Schrödinger-Poisson loop are interleaved, i.e., the
# self-energies are kept from one potential to the next.
scba_iterations_per_step = 2

max_iterations = 60
convergence_tol = 2e-3 # V

[electrostatics]
# The tube is embedded in SiO2, consistent with `epsilon_r` in
# [coulomb_screening].
default_epsilon_r = 3.9
density_model = "ldos"

[device]
transport_direction = "a"
block_size = 32
kpoint_grid = [1, 1, 1]
num_orbitals_per_atom = { "X" = 1 }

    [device.geometry]
    default_mesh_size = 2
    atoms_mesh_size = 1

        # Gate all around the channel.
        [[device.geometry.regions]]
        name = "gate"

        shape.type = "tube"
        shape.center = [51.424, 25, 25]
        shape.axis = [1, 0, 0]
        shape.radius = 12
        shape.length = 26

        properties.voltage = -0.3

        # Oxide between the tube and the gate.
        [[device.geometry.regions]]
        name = "oxide"

        properties.epsilon_r = 3.9

        shape.type = "difference"

        shape.base.type = "cylinder"
        shape.base.center = [51.424, 25, 25]
        shape.base.axis = [1, 0, 0]
        shape.base.radius = 12
        shape.base.length = 26

        shape.subtract.type = "cylinder"
        shape.subtract.center = [51.424, 25, 25]
        shape.subtract.axis = [1, 0, 0]
        shape.subtract.radius = 7.5
        shape.subtract.length = 26

        # n-doped leads (eight unit cells each).
        [[device.geometry.regions]]
        name = "left"

        shape.type = "box"
        shape.bounds = [[0, 0, 0], [34.28, 50, 50]]

        properties.donor_concentration = 2e19 # cm^-3

        [[device.geometry.regions]]
        name = "right"

        shape.type = "box"
        shape.bounds = [[68.5, 0, 0], [102.849, 50, 50]]

        properties.donor_concentration = 2e19 # cm^-3


    # NOTE: GW renormalizes the band edges, but band edge tracking is not
    # available in Schrödinger-Poisson runs. All levels are therefore set
    # to those of the homogeneous, doped tube with GW, see the README.
    [[device.contacts]]
    name = "left"
    origin = [0.1551, 0.0, 0.0]
    lattice_vectors = [[4.27615261, 0, 0], [0, 50, 0], [0, 0, 50]]
    transport_direction = "a"

    fermi_level = -2.896
    mid_gap_energy = -3.41
    conduction_band_edge = -3.08

    voltage = 0.0

    [[device.contacts]]
    name = "right"
    origin = [102.694, 0.0, 0.0]
    lattice_vectors = [[-4.27615261, 0, 0], [0, 50, 0], [0, 0, 50]]
    transport_direction = "a"

    fermi_level = -2.896
    mid_gap_energy = -3.41
    conduction_band_edge = -3.08

    voltage = 0.1

[outputs]
# NOTE: Required to compute the charge density.
electron_density = true
hole_density = true

# NOTE: Uncomment to save matrices of the last SCBA iteration (27 GB for
# all of them), see the README.
# scba_matrices = ["g", "p", "w", "sigma"]

[electron]
energy_window_min = -14.0
energy_window_max = 3.0
# NOTE: The 5 meV grid resolves the narrow hole states bound in the channel.
# On a 25 meV grid, the self-energies spike unless a large `eta` is used, see
# the README.
energy_window_num = 3401

max_batch_size = 15
solver.algorithm = "rgf"

obc.algorithm = "spectral"
obc.nevp_solver = "full"
obc.max_decay = 15
obc.residual_tolerance = 1e-4

obc.memoizer.mode = "off"

[coulomb_screening]
interaction_cutoff = 8 # Å
epsilon_r = 4.0

num_connected_blocks = 2

max_batch_size = 15
solver.algorithm = "rgf"

obc.algorithm = "spectral"
obc.nevp_solver = "full"
obc.max_decay = 15
obc.residual_tolerance = 1e-4
obc.memoizer.mode = "off"

lyapunov.algorithm = "spectral"
lyapunov.num_ref_iterations = 1
lyapunov.memoizer.mode = "off"

[phonon]
interaction_cutoff = 5.5 # Å
model = "pseudo-scattering"
phonon_energy = 50e-3
deformation_potential = 25e-3
